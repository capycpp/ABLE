
<!doctype html>
<html>

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>ABLE — Problem</title>

<link rel="stylesheet" href="/style.css">
<script defer src="/app.js"></script>

<!-- MathJax -->
<script>
window.MathJax = {
  tex: {
    inlineMath: [
      ['\\(', '\\)'],
      ['$', '$']
    ],
    displayMath: [
      ['\\[', '\\]'],
      ['$$', '$$']
    ]
  },
  svg: {
    fontCache: 'global'
  }
};
</script>

<script
  async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js">
</script>

</head>


<body>

<script>

(async () => {

  const params = new URLSearchParams(location.search);
  const id = params.get('id');

  if (!id) {
    location.href = '/problems.html';
    return;
  }

  try {

    /* Get problem from backend */
    const d = await api('/api/content');

    const problem = d.problems.find(p => p.id === id);

    if (!problem) {

      document.body.innerHTML = `
        <div style="
          padding:80px;
          text-align:center;
          color:white;
          font-family:sans-serif;
        ">

          <h1>Problem not found</h1>

          <a
            href="/problems.html"
            style="color:#60a5fa;"
          >
            ← Back to Problems
          </a>

        </div>
      `;

      return;
    }


    function esc(x = '') {

      return String(x)
        .replace(/[&<>"']/g, c => ({
          '&':'&amp;',
          '<':'&lt;',
          '>':'&gt;',
          '"':'&quot;',
          "'":'&#39;'
        }[c]));

    }


    shell(
      'Problems',
      problem.title,

      `

      <!-- HERO -->

      <section class="pagehero">

        <div class="wrap">

          <div class="eyebrow">
            ${esc(problem.topic || 'Problem')}
            ${problem.difficulty
              ? ` · ${esc(problem.difficulty)}`
              : ''
            }
          </div>

          <h1>
            ${esc(problem.title)}
          </h1>

          <p class="lead">
            Source: ${esc(problem.source || 'ABLE Archive')}
          </p>

        </div>

      </section>


      <!-- PROBLEM CONTENT -->

      <section class="section">

        <div class="wrap">

          <main
            id="problem-content"
            style="
              max-width:850px;
              margin:0 auto;
              padding:10px 0 70px;
            "
          >

            <!-- STATEMENT -->

            <div
              id="problem-statement"
              style="
                white-space:pre-wrap;
                line-height:1.9;
                font-size:18px;
                color:#f1f5f9;
              "
            >
${esc(
  problem.statement ||
  'The problem statement has not been added yet.'
)}
            </div>


            <!-- SHOW SOLUTION -->

            ${
              problem.solution
                ? `
                  <div style="
                    margin-top:40px;
                    padding-top:25px;
                  ">

                    <button
                      id="solution-btn"
                      class="btn primary"
                      type="button"
                      onclick="showSolution()"
                    >
                      Show solution
                    </button>

                  </div>
                `
                : ''
            }


            <!-- SOLUTION -->

            ${
              problem.solution
                ? `
                  <div
                    id="solution-section"
                    style="
                      display:none;
                      margin-top:45px;
                      padding:28px 0 10px;
                    "
                  >

                    <div
                      style="
                        font-size:13px;
                        letter-spacing:.16em;
                        text-transform:uppercase;
                        color:#8da4c7;
                        margin-bottom:20px;
                        font-weight:600;
                      "
                    >
                      Solution:
                    </div>


                    <div
                      id="solution-content"
                      style="
                        white-space:pre-wrap;
                        line-height:1.9;
                        font-size:18px;
                        color:#e8edf5;
                      "
                    >
${esc(problem.solution)}
                    </div>

                  </div>
                `
                : ''
            }


            <!-- BACK -->

            <div style="
              margin-top:45px;
            ">

              <a
                class="btn"
                href="/problems.html"
              >
                ← Back to Problems
              </a>

            </div>

          </main>

        </div>

      </section>

      `
    );


    /*
      SHOW SOLUTION
    */

    window.showSolution = function() {

      const section =
        document.getElementById('solution-section');

      const button =
        document.getElementById('solution-btn');

      if (!section) return;

      section.style.display = 'block';

      if (button) {
        button.style.display = 'none';
      }

      /*
        Render LaTeX inside solution
      */

      if (
        window.MathJax &&
        MathJax.typesetPromise
      ) {

        MathJax.typesetPromise([
          document.getElementById('problem-content')
        ]);

      }

      section.scrollIntoView({
        behavior: 'smooth',
        block: 'start'
      });

    };


    /*
      Render LaTeX in the problem statement
    */

    function renderMath() {

      if (
        window.MathJax &&
        MathJax.typesetPromise
      ) {

        MathJax.typesetPromise([
          document.getElementById('problem-content')
        ]);

      } else {

        setTimeout(renderMath, 300);

      }

    }

    renderMath();


  } catch (error) {

    console.error(
      'Problem loading error:',
      error
    );

    document.body.innerHTML = `

      <div style="
        padding:80px;
        text-align:center;
        color:white;
        font-family:sans-serif;
      ">

        <h1>
          Unable to load problem
        </h1>

        <p>
          Please try again in a moment.
        </p>

        <a
          href="/problems.html"
          style="color:#60a5fa;"
        >
          ← Back to Problems
        </a>

      </div>

    `;

  }

})();

</script>

</body>
</html>
