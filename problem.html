<!doctype html>
<html>

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>ABLE — Problem</title>

<link rel="stylesheet" href="/style.css">

<!-- IMPORTANT:
     app.js MUST load before the code below,
     because problem page uses api() and shell().
-->
<script src="/app.js"></script>

<!-- MathJax -->
<script>
window.MathJax = {
  tex: {
    inlineMath: [
      ['\\(', '\\)'],
      ['$', '$']
    ],
    displayMath: [
      ['\\[', '\\]'],
      ['$$', '$$']
    ]
  },

  svg: {
    fontCache: 'global'
  }
};
</script>

<script
  async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js">
</script>

</head>


<body>

<script>

(async () => {

  const params = new URLSearchParams(location.search);
  const id = params.get('id');

  if (!id) {
    location.href = '/problems.html';
    return;
  }

  try {

    /*
      Load content through the same API
      used everywhere else on the website.
    */

    const d = await api('/api/content');

    const problem = d.problems.find(
      p => p.id === id
    );


    /*
      Problem not found
    */

    if (!problem) {

      document.body.innerHTML = `

        <div style="
          min-height:100vh;
          display:flex;
          align-items:center;
          justify-content:center;
          background:#07080a;
          color:white;
          font-family:sans-serif;
          text-align:center;
          padding:40px;
        ">

          <div>

            <h1>
              Problem not found
            </h1>

            <a
              href="/problems.html"
              style="color:#60a5fa;"
            >
              ← Back to Problems
            </a>

          </div>

        </div>

      `;

      return;
    }


    /*
      Escape HTML safely.
      This does NOT remove LaTeX commands.
    */

    function esc(x = '') {

      return String(x)
        .replace(/[&<>"']/g, c => ({
          '&':'&amp;',
          '<':'&lt;',
          '>':'&gt;',
          '"':'&quot;',
          "'":'&#39;'
        }[c]));

    }


    /*
      Build the page
    */

    shell(
      'Problems',
      problem.title,

      `

      <main
        class="problem-page"
        style="
          background:
            radial-gradient(
              circle at 20% 0%,
              rgba(25,70,75,.18),
              transparent 38%
            ),
            radial-gradient(
              circle at 85% 0%,
              rgba(45,45,80,.18),
              transparent 40%
            ),
            #07080a;

          min-height:calc(100vh - 70px);
        "
      >


        <!-- HERO + PROBLEM ARE NOW ONE CONTINUOUS AREA -->

        <section
          style="
            background:transparent;
            border:0;
            box-shadow:none;
            padding:70px 0 80px;
          "
        >

          <div
            class="wrap"
            style="
              max-width:900px;
              margin:0 auto;
            "
          >

            <!-- TOP LABEL -->

            <div
              class="eyebrow"
              style="
                margin-bottom:14px;
              "
            >
              ${esc(problem.topic || 'PROBLEM')}
              ${
                problem.difficulty
                  ? ` · ${esc(problem.difficulty)}`
                  : ''
              }
            </div>


            <!-- TITLE -->

            <h1
              style="
                margin:0;
                font-size:clamp(42px,6vw,72px);
                line-height:1.02;
                letter-spacing:-.045em;
              "
            >
              ${esc(problem.title)}
            </h1>


            <!-- SOURCE -->

            <p
              style="
                margin-top:18px;
                margin-bottom:0;
                color:#8fa4c4;
                font-size:14px;
              "
            >
              Source:
              ${esc(problem.source || 'ABLE Archive')}
            </p>


            <!-- PROBLEM STATEMENT -->

            <div
              id="problem-content"
              style="
                margin-top:55px;
                max-width:850px;
                color:#eef2f7;
                font-size:19px;
                line-height:1.9;
                white-space:pre-wrap;
              "
            >
${esc(
  problem.statement ||
  'The problem statement has not been added yet.'
)}
            </div>


            <!-- SHOW SOLUTION -->

            ${
              problem.solution
                ? `

                  <div
                    style="
                      margin-top:55px;
                      padding-top:28px;
                      border-top:1px solid rgba(255,255,255,.08);
                    "
                  >

                    <button
                      id="solution-btn"
                      class="btn primary"
                      type="button"
                      onclick="showSolution()"
                    >
                      Show solution
                    </button>

                  </div>

                `
                : ''
            }


            <!-- SOLUTION -->

            ${
              problem.solution
                ? `

                  <div
                    id="solution-section"
                    style="
                      display:none;
                      margin-top:50px;
                      max-width:850px;
                    "
                  >

                    <div
                      style="
                        color:#9bb7df;
                        font-size:13px;
                        font-weight:600;
                        letter-spacing:.18em;
                        text-transform:uppercase;
                        margin-bottom:28px;
                      "
                    >
                      Solution:
                    </div>


                    <div
                      id="solution-content"
                      style="
                        color:#eef2f7;
                        font-size:19px;
                        line-height:1.9;
                        white-space:pre-wrap;
                      "
                    >
${esc(problem.solution)}
                    </div>

                  </div>

                `
                : ''
            }


            <!-- BACK -->

            <div
              style="
                margin-top:60px;
              "
            >

              <a
                class="btn"
                href="/problems.html"
              >
                ← Back to Problems
              </a>

            </div>

          </div>

        </section>

      </main>

      `
    );


    /*
      SHOW SOLUTION
    */

    window.showSolution = function() {

      const section =
        document.getElementById(
          'solution-section'
        );

      const button =
        document.getElementById(
          'solution-btn'
        );

      if (!section) return;


      /*
        Show solution
      */

      section.style.display = 'block';


      /*
        Hide button
      */

      if (button) {
        button.style.display = 'none';
      }


      /*
        Render LaTeX
      */

      renderMath();


      /*
        Smoothly move to solution
      */

      setTimeout(() => {

        section.scrollIntoView({
          behavior:'smooth',
          block:'start'
        });

      }, 100);

    };


    /*
      Render MathJax
    */

    function renderMath() {

      if (
        window.MathJax &&
        MathJax.typesetPromise
      ) {

        MathJax.typesetPromise([
          document.getElementById(
            'problem-content'
          ),
          document.getElementById(
            'solution-content'
          )
        ]);

      } else {

        setTimeout(
          renderMath,
          300
        );

      }

    }


    /*
      Render the problem LaTeX
      immediately after page loads.
    */

    renderMath();


  } catch (error) {

    console.error(
      'Problem loading error:',
      error
    );


    document.body.innerHTML = `

      <div
        style="
          min-height:100vh;
          display:flex;
          align-items:center;
          justify-content:center;
          background:#07080a;
          color:white;
          font-family:sans-serif;
          text-align:center;
          padding:40px;
        "
      >

        <div>

          <h1>
            Unable to load problem
          </h1>

          <p
            style="
              color:#94a3b8;
              margin-top:15px;
            "
          >
            Please try again in a moment.
          </p>

          <a
            href="/problems.html"
            style="
              color:#60a5fa;
              display:inline-block;
              margin-top:15px;
            "
          >
            ← Back to Problems
          </a>

        </div>

      </div>

    `;

  }

})();

</script>

</body>
</html>
