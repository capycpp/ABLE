<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ABLE — Login</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head><body><header class="top"><div class="wrap nav"><a class="brand" href="/">ABLE</a><a class="btn" href="/signup.html">Create account</a></div></header><main class="auth"><form class="authbox" id="form"><div class="eyebrow">ABLE Account</div><h1>Welcome back.</h1><p>Sign in to your ABLE account.</p><div class="field"><label>Email</label><input class="input" name="email" type="email" required autocomplete="email"></div><div class="field"><label>Password</label><input class="input" name="password" type="password" required autocomplete="current-password"></div><button class="submit">Log in</button><div class="notice" id="notice"></div></form></main><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),n=document.getElementById('notice');try{const d=await api('/api/login',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});n.className='notice success';n.textContent='Logged in. Redirecting…';location.href=d.user.role==='admin'?'/admin.html':'/account.html'}catch(err){n.className='notice error';n.textContent=err.message}}</script></body></html>
