<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ABLE — Problems</title>
<link rel="stylesheet" href="/style.css">
<script defer src="/app.js"></script>
</head>

<body>

<script>
document.addEventListener('DOMContentLoaded', async () => {

  const d = await api('/api/content');

  const cards = d.problems.map(p => `
    <article class="card">
      <div class="tag">${p.topic || 'Problem'} · ${p.difficulty || ''}</div>
      <h3>${p.title}</h3>
      <p>Source: ${p.source || 'ABLE Archive'}</p>
      <div class="meta">
        <span>${p.status || 'published'}</span>
        <span>Open →</span>
      </div>
    </article>
  `).join('');

  shell(
    'Problems',
    'Problems',
    `
      <section class="pagehero">
        <div class="wrap">
          <div class="eyebrow">01 — Problems</div>
          <h1>Problems worth<br>struggling with.</h1>
          <p class="lead">
            A clean, growing archive of olympiad problems. No productivity noise —
            just the problem, the idea and the solution.
          </p>
        </div>
      </section>

      <section class="section">
        <div class="wrap">
          <div class="toolbar">
            <input class="input" id="search" placeholder="Search problems...">

            <select class="select" id="topic">
              <option>All topics</option>
              <option>Functional Equations</option>
              <option>Geometry</option>
              <option>Number Theory</option>
              <option>Combinatorics</option>
            </select>
          </div>

          <div class="cards" id="cards">${cards}</div>
        </div>
      </section>
    `
  );

  const all = d.problems;

  document.getElementById('search').oninput = filter;
  document.getElementById('topic').onchange = filter;

  function filter() {
    const q = document.getElementById('search').value.toLowerCase();
    const t = document.getElementById('topic').value;

    document.getElementById('cards').innerHTML =
      all
        .filter(p =>
          (!q || p.title.toLowerCase().includes(q)) &&
          (t === 'All topics' || p.topic === t)
        )
        .map(p => `
          <article class="card">
            <div class="tag">${p.topic || 'Problem'} · ${p.difficulty || ''}</div>
            <h3>${p.title}</h3>
            <p>Source: ${p.source || 'ABLE Archive'}</p>
            <div class="meta">
              <span>${p.status || 'published'}</span>
              <span>Open →</span>
            </div>
          </article>
        `)
        .join('') ||
      '<div class="empty">No problems found.</div>';
  }

});
</script>

</body>
</html>
