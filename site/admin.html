<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ABLE — Admin</title>
  <link rel="stylesheet" href="/style.css">
  <script defer src="/app.js"></script>
</head>

<body>

<div id="root"></div>

<script>

let state = {
  type: 'problems',
  editing: null
};

document.addEventListener('DOMContentLoaded', async () => {

  let user = null;

  try {
    const res = await api('/api/me');
    user = res.user;
  } catch (e) {
    console.error('Authentication error:', e);
  }

  if (!user || user.role !== 'admin') {
    document.getElementById('root').innerHTML = `
      <div style="
        padding:50px;
        text-align:center;
        color:#fff;
        font-family:sans-serif;
      ">
        <h2>Access Denied</h2>
        <p>Please log in with the admin account first.</p>

        <a
          href="/login.html"
          style="color:#60a5fa;text-decoration:underline;"
        >
          Go to Login
        </a>
      </div>
    `;
    return;
  }

  document.getElementById('root').innerHTML = `

    <header class="top">

      <div class="wrap nav">

        <a class="brand" href="/">
          ABLE
        </a>

        <div class="actions">

          <span
            style="
              color:#aeb7c8;
              margin-right:10px;
              font-size:14px;
            "
          >
            ${esc(user.name)}
          </span>

          <a class="btn" href="/">
            View site
          </a>

          <button
            class="btn"
            onclick="logout()"
          >
            Log out
          </button>

        </div>

      </div>

    </header>

    <main class="admin">

      <div class="wrap">

        <div class="admin-grid">

          <aside class="admin-side">

            <button
              class="active"
              data-type="problems"
            >
              Problems
            </button>

            <button
              data-type="articles"
            >
              Articles
            </button>

            <button
              data-type="contests"
            >
              Contests
            </button>

            <button
              data-type="users"
            >
              Users
            </button>

          </aside>

          <section
            class="admin-main"
            id="main"
          ></section>

        </div>

      </div>

    </main>
  `;

  document
    .querySelectorAll('.admin-side button')
    .forEach(button => {

      button.addEventListener('click', () => {

        document
          .querySelectorAll('.admin-side button')
          .forEach(x => {
            x.classList.remove('active');
          });

        button.classList.add('active');

        state.type = button.dataset.type;
        state.editing = null;

        render();

      });

    });

  render();

});


async function render() {

  const m = document.getElementById('main');

  if (!m) return;

  /*
   * USERS
   */

  if (state.type === 'users') {

    m.innerHTML = `
      <div class="admin-head">

        <div>
          <div class="eyebrow">
            Admin
          </div>

          <h2>
            Users
          </h2>
        </div>

      </div>

      <div style="
        padding:25px;
        color:#aeb7c8;
      ">
        Loading users...
      </div>
    `;

    try {

      const d = await api('/api/admin/users');

      if (!d || !Array.isArray(d.users)) {
        throw new Error('Invalid users response from server.');
      }

      if (d.users.length === 0) {

        m.innerHTML = `
          <div class="admin-head">
            <div>
              <div class="eyebrow">Admin</div>
              <h2>Users</h2>
            </div>
          </div>

          <div class="bigcard">
            <h3>No users found.</h3>
            <p>
              There are currently no registered users.
            </p>
          </div>
        `;

        return;
      }

      m.innerHTML = `

        <div class="admin-head">

          <div>
            <div class="eyebrow">
              Admin
            </div>

            <h2>
              Users
            </h2>
          </div>

          <div style="
            color:#9ca7bb;
            font-size:14px;
          ">
            ${d.users.length} user${d.users.length === 1 ? '' : 's'}
          </div>

        </div>

        <div class="bigcard">

          <div style="overflow-x:auto;">

            <table class="table">

              <thead>

                <tr>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Role</th>
                  <th>Created</th>
                </tr>

              </thead>

              <tbody>

                ${d.users.map(u => `

                  <tr>

                    <td>
                      ${esc(u.name)}
                    </td>

                    <td>
                      ${esc(u.email)}
                    </td>

                    <td>
                      ${esc(u.role)}
                    </td>

                    <td>
                      ${
                        u.createdAt
                          ? new Date(u.createdAt)
                              .toLocaleDateString()
                          : '—'
                      }
                    </td>

                  </tr>

                `).join('')}

              </tbody>

            </table>

          </div>

        </div>
      `;

      return;

    } catch (e) {

      console.error(
        'Users loading error:',
        e
      );

      m.innerHTML = `

        <div class="admin-head">

          <div>
            <div class="eyebrow">
              Admin
            </div>

            <h2>
              Users
            </h2>
          </div>

        </div>

        <div class="bigcard">

          <h3>
            Could not load users
          </h3>

          <p style="
            color:#aeb7c8;
            margin-top:10px;
          ">
            ${esc(e.message || 'Unknown error')}
          </p>

          <button
            class="btn primary"
            style="margin-top:20px"
            onclick="render()"
          >
            Try Again
          </button>

        </div>

      `;

      return;
    }
  }


  /*
   * PROBLEMS / ARTICLES / CONTESTS
   */

  try {

    const d = await api('/api/content');

    const items = Array.isArray(d[state.type])
      ? d[state.type]
      : [];

    m.innerHTML = `

      <div class="admin-head">

        <div>

          <div class="eyebrow">
            Content manager
          </div>

          <h2>
            ${
              state.type[0].toUpperCase()
              + state.type.slice(1)
            }
          </h2>

        </div>

        <button
          class="btn primary"
          onclick="newItem()"
        >
          + New
        </button>

      </div>

      <div class="rows">

        ${
          items.length
          ? items.map(x => `

            <div class="row">

              <div>

                <h3>
                  ${esc(x.title)}
                </h3>

                <p>
                  ${esc(
                    x.excerpt ||
                    x.description ||
                    x.topic ||
                    x.category ||
                    ''
                  )}
                </p>

              </div>

              <div>
                ${esc(x.status || 'published')}
              </div>

              <div class="right">

                <button
                  class="btn"
                  onclick="editItem('${esc(x.id)}')"
                >
                  Edit
                </button>

                <button
                  class="btn"
                  onclick="removeItem('${esc(x.id)}')"
                >
                  Delete
                </button>

              </div>

            </div>

          `).join('')

          : `
            <div class="bigcard">
              <h3>No items found.</h3>
            </div>
          `
        }

      </div>

      ${
        state.editing
          ? formHtml(state.editing)
          : ''
      }

    `;

  } catch (e) {

    console.error(
      'Content loading error:',
      e
    );

    m.innerHTML = `

      <div class="bigcard">

        <h3>
          Could not load content
        </h3>

        <p style="color:#aeb7c8">
          ${esc(e.message)}
        </p>

        <button
          class="btn primary"
          style="margin-top:20px"
          onclick="render()"
        >
          Try Again
        </button>

      </div>

    `;
  }

}


function esc(x = '') {

  return String(x).replace(
    /[&<>"']/g,

    c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c])
  );

}


function newItem() {

  state.editing = {

    id: null,
    title: '',
    topic: '',
    difficulty: '',
    source: '',
    statement: '',
    solution: '',

    category: '',
    excerpt: '',
    body: '',

    year: '',
    type: '',
    description: '',

    status: 'published'

  };

  render();

}


async function editItem(id) {

  try {

    const d = await api('/api/content');

    state.editing =
      d[state.type].find(
        x => x.id === id
      );

    render();

  } catch (e) {

    toast(e.message);

  }

}


function formHtml(x) {

  let fields = '';


  if (state.type === 'problems') {

    fields = `
      <div class="field">

        <label>Title</label>

        <input
          class="input"
          id="f-title"
          value="${esc(x.title)}"
        >

      </div>


      <div class="formgrid">

        <div class="field">

          <label>Topic</label>

          <input
            class="input"
            id="f-topic"
            value="${esc(x.topic)}"
          >

        </div>


        <div class="field">

          <label>Difficulty</label>

          <input
            class="input"
            id="f-difficulty"
            value="${esc(x.difficulty)}"
          >

        </div>


        <div class="field">

          <label>Source</label>

          <input
            class="input"
            id="f-source"
            value="${esc(x.source)}"
          >

        </div>


        <div class="field">

          <label>Status</label>

          <input
            class="input"
            id="f-status"
            value="${esc(x.status)}"
          >

        </div>

      </div>


      <div class="field">

        <label>Problem Statement</label>

        <textarea
          class="textarea"
          id="f-statement"
          rows="10"
          placeholder="Write the full problem statement here..."
        >${esc(x.statement)}</textarea>

      </div>


      <div class="field">

        <label>Solution</label>

        <textarea
          class="textarea"
          id="f-solution"
          rows="15"
          placeholder="Write the solution here..."
        >${esc(x.solution)}</textarea>

      </div>
    `;
  }


  if (state.type === 'articles') {

    fields = `

      <div class="field">

        <label>
          Title
        </label>

        <input
          class="input"
          id="f-title"
          value="${esc(x.title)}"
        >

      </div>


      <div class="formgrid">

        <div class="field">

          <label>
            Category
          </label>

          <input
            class="input"
            id="f-category"
            value="${esc(x.category)}"
          >

        </div>


        <div class="field">

          <label>
            Status
          </label>

          <input
            class="input"
            id="f-status"
            value="${esc(x.status)}"
          >

        </div>

      </div>


      <div class="field">

        <label>
          Excerpt
        </label>

        <textarea
          class="textarea"
          id="f-excerpt"
          rows="3"
        >${esc(x.excerpt)}</textarea>

      </div>


      <div class="field">

        <label>
          Body
        </label>

        <textarea
          class="textarea"
          id="f-body"
          rows="7"
        >${esc(x.body)}</textarea>

      </div>

    `;
  }


  if (state.type === 'contests') {

    fields = `

      <div class="field">

        <label>
          Title
        </label>

        <input
          class="input"
          id="f-title"
          value="${esc(x.title)}"
        >

      </div>


      <div class="formgrid">

        <div class="field">

          <label>
            Year
          </label>

          <input
            class="input"
            id="f-year"
            value="${esc(x.year)}"
          >

        </div>


        <div class="field">

          <label>
            Type
          </label>

          <input
            class="input"
            id="f-type"
            value="${esc(x.type)}"
          >

        </div>


        <div class="field full">

          <label>
            Status
          </label>

          <input
            class="input"
            id="f-status"
            value="${esc(x.status)}"
          >

        </div>

      </div>


      <div class="field">

        <label>
          Description
        </label>

        <textarea
          class="textarea"
          id="f-description"
          rows="5"
        >${esc(x.description)}</textarea>

      </div>

    `;
  }


  return `

    <div
      class="bigcard"
      style="margin-top:25px"
    >

      <div class="tag">
        ${x.id ? 'EDIT' : 'CREATE'}
      </div>

      ${fields}

      <div class="actionsline">

        <button
          class="btn primary"
          onclick="saveItem()"
        >
          Save
        </button>

        <button
          class="btn"
          onclick="
            state.editing=null;
            render()
          "
        >
          Cancel
        </button>

      </div>

    </div>

  `;

}


async function saveItem() {

  const x = state.editing;
  const data = {};

  document
    .querySelectorAll('[id^=f-]')
    .forEach(el => {
      data[el.id.slice(2)] = el.value;
    });

  try {

    if (x.id) {

      await api(
        `/api/admin/${state.type}/${x.id}`,
        {
          method:'PUT',
          body:JSON.stringify(data)
        }
      );

    } else {

      await api(
        `/api/admin/${state.type}`,
        {
          method:'POST',
          body:JSON.stringify(data)
        }
      );

    }

    state.editing = null;

    toast('Saved');

    render();

  } catch (e) {

    console.error(e);

    toast(e.message);

  }

}


async function removeItem(id) {

  if (!confirm('Delete this item?')) {
    return;
  }

  try {

    await api(
      `/api/admin/${state.type}/${id}`,
      {
        method:'DELETE'
      }
    );

    toast('Deleted');

    render();

  } catch (e) {

    toast(e.message);

  }

}

</script>
</body>
</html>
