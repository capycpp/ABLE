<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ABLE — Join Us</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head><body><header class="top"><div class="wrap nav"><a class="brand" href="/">ABLE</a><a class="btn" href="/login.html">Log in</a></div></header><main class="auth"><form class="authbox" id="form"><div class="eyebrow">Join ABLE</div><h1>Create your account.</h1><p>One account for the ABLE platform.</p><div class="field"><label>Name</label><input class="input" name="name" required autocomplete="name"></div><div class="field"><label>Email</label><input class="input" name="email" type="email" required autocomplete="email"></div><div class="field"><label>Password</label><input class="input" name="password" type="password" minlength="8" required autocomplete="new-password"><div class="small">At least 8 characters.</div></div><button class="submit">Create account</button><div class="notice" id="notice"></div></form></main><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),n=document.getElementById('notice');try{await api('/api/signup',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});n.className='notice success';n.textContent='Account created. Redirecting…';setTimeout(()=>location.href='/account.html',400)}catch(err){n.className='notice error';n.textContent=err.message}}</script></body></html>
