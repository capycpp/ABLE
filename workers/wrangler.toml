name = "able-math-backend"
main = "./dist/index.js"
compatibility_date = "2026-09-02"

[vars]
JWT_SECRET = "__REPLACE_WITH_STRONG_SECRET__"

[env.production]
bindings = [
  { name = "DB", type = "d1", id = "__D1_BINDING_ID__" },
  { name = "CACHE", type = "kv_namespace", id = "__KV_NAMESPACE_ID__" }
]
